name: Release Keycloak.Net.Sdk.Aspire

on:
  push:
    tags:
      - 'aspire/v*'

jobs:
  test:
    name: Build & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Validate release tag
        shell: bash
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          version=$(dotnet msbuild Keycloak.Net.Sdk.Aspire/Keycloak.Net.Sdk.Aspire.csproj -getProperty:Version)
          hosting_version=$(dotnet msbuild Keycloak.Net.Sdk.Aspire.Hosting/Keycloak.Net.Sdk.Aspire.Hosting.csproj -getProperty:Version)
          test "$version" = "$hosting_version"
          test "$GITHUB_REF_NAME" = "aspire/v$version"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Unit Tests
        run: dotnet test Keycloak.Net.Sdk.UnitTests/Keycloak.Net.Sdk.UnitTests.csproj --configuration Release --no-build --verbosity normal

      - name: Integration Tests
        run: dotnet test Keycloak.Net.Sdk.IntegrationTests/Keycloak.Net.Sdk.IntegrationTests.csproj --configuration Release --no-build --framework net10.0 --verbosity normal

  publish:
    name: Pack & Publish to NuGet
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # NuGet Trusted Publishing exchanges the GitHub OIDC token for a short-lived API key
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: |
          dotnet build Keycloak.Net.Sdk.Aspire/Keycloak.Net.Sdk.Aspire.csproj --configuration Release --no-restore
          dotnet build Keycloak.Net.Sdk.Aspire.Hosting/Keycloak.Net.Sdk.Aspire.Hosting.csproj --configuration Release --no-restore

      - name: Pack
        run: |
          dotnet pack Keycloak.Net.Sdk.Aspire/Keycloak.Net.Sdk.Aspire.csproj --configuration Release --no-build --output ./nupkgs
          dotnet pack Keycloak.Net.Sdk.Aspire.Hosting/Keycloak.Net.Sdk.Aspire.Hosting.csproj --configuration Release --no-build --output ./nupkgs

      - name: NuGet login (Trusted Publishing)
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: MiladRv # nuget.org profile name of the package owner

      - name: Publish to NuGet
        run: dotnet nuget push ./nupkgs/*.nupkg --source https://api.nuget.org/v3/index.json --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} --skip-duplicate

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: keycloak-aspire-packages
          path: ./nupkgs/*.nupkg
          if-no-files-found: error
